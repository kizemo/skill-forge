[project]
name = "skill-forge"
version = "0.1.0"
description = "Meta-skill: audit, create, improve, retire other skills."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "pytest>=8.0"]

[project.scripts]
skill-forge = "scripts.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

# RULING-4 (T8): bare `pytest -q` from skill-forge/ must resolve `scripts.*`
# without `python -m`. pytest's default `prepend` import mode otherwise inserts
# tests/ ahead of the rootdir and collection fails at import time.
[tool.pytest.ini_options]
pythonpath = ["."]
